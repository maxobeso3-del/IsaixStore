name: Build Isaix Store IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'IsaixStore_GitHub_Actions_Build.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          echo "SOURCE_DIR=$GITHUB_WORKSPACE/extracted/IsaixStore-Rebuild" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.SOURCE_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          xcodebuild \
            -project IsaixStore.xcodeproj \
            -scheme IsaixStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/IsaixStore.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry IsaixStore-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsaixStore-unsigned-IPA
          path: extracted/IsaixStore-Rebuild/IsaixStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
